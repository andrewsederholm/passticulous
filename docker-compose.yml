services:
  passticulous:
    build: .
    image: passticulous:latest
    container_name: passticulous
    restart: unless-stopped
    ports:
      # Host port is configurable: PASSTICULOUS_PORT=9000 docker compose up -d
      - "${PASSTICULOUS_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      BIND_ADDR: "0.0.0.0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/passticulous", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
